<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Perfect Day</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff5d7;
    overflow: hidden;
}

/* GAME */

#game {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background:
        linear-gradient(#8ed6ff 0%, #c9f1ff 55%, #9bd36a 55%, #75bd55 100%);
}

/* SUN */

.sun {
    position: absolute;
    top: 35px;
    right: 60px;
    width: 90px;
    height: 90px;
    background: #ffd93d;
    border-radius: 50%;
    box-shadow: 0 0 35px #ffd93d;
}

/* CLOUDS */

.cloud {
    position: absolute;
    background: white;
    width: 110px;
    height: 35px;
    border-radius: 30px;
    opacity: .9;
}

.cloud:before,
.cloud:after {
    content: "";
    position: absolute;
    background: white;
    border-radius: 50%;
}

.cloud:before {
    width: 45px;
    height: 45px;
    top: -22px;
    left: 20px;
}

.cloud:after {
    width: 55px;
    height: 55px;
    top: -30px;
    right: 15px;
}

.cloud1 {
    top: 80px;
    left: 12%;
}

.cloud2 {
    top: 160px;
    left: 55%;
}

/* ROAD */

.road {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 45%;
    background: #777;
    transform: perspective(300px) rotateX(10deg);
}

.road:before {
    content: "";
    position: absolute;
    left: 0;
    top: 45%;
    width: 100%;
    border-top: 8px dashed white;
}

/* HOUSES */

.house {
    position: absolute;
    bottom: 42%;
    width: 130px;
    height: 100px;
    background: #ff9f68;
    border: 5px solid #743b2c;
}

.house:before {
    content: "";
    position: absolute;
    top: -65px;
    left: -15px;
    border-left: 80px solid transparent;
    border-right: 80px solid transparent;
    border-bottom: 65px solid #d94f4f;
}

.window {
    position: absolute;
    width: 30px;
    height: 35px;
    background: #8ee5ff;
    border: 4px solid #743b2c;
    top: 25px;
    left: 20px;
}

.door {
    position: absolute;
    width: 35px;
    height: 55px;
    background: #70452f;
    bottom: 0;
    right: 20px;
}

.house1 {
    left: 5%;
}

.house2 {
    right: 8%;
    background: #ffc857;
}

/* PLAYER */

#player {
    position: absolute;
    width: 55px;
    height: 65px;
    left: 50%;
    bottom: 25%;
    transform: translateX(-50%);
    transition: .08s;
    z-index: 10;
}

.head {
    width: 42px;
    height: 42px;
    background: #d99a6c;
    border-radius: 50%;
    margin: auto;
    position: relative;
    border: 3px solid #542f27;
}

.head:before {
    content: "👑";
    position: absolute;
    top: -18px;
    left: 8px;
    font-size: 25px;
}

.body {
    width: 38px;
    height: 30px;
    background: #ff6b9d;
    border-radius: 12px 12px 5px 5px;
    margin: -2px auto;
}

/* ITEMS */

.item {
    position: absolute;
    font-size: 45px;
    cursor: pointer;
    z-index: 5;
    animation: bounce 1s infinite alternate;
}

@keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-8px); }
}

#sunItem {
    left: 20%;
    bottom: 55%;
}

#foodItem {
    left: 70%;
    bottom: 47%;
}

#musicItem {
    left: 43%;
    bottom: 62%;
}

/* BAD ITEMS */

.bad {
    position: absolute;
    font-size: 40px;
    z-index: 5;
}

#alarm {
    left: 32%;
    bottom: 48%;
}

#homework {
    right: 25%;
    bottom: 60%;
}

/* UI */

#topbar {
    position: absolute;
    top: 15px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    z-index: 20;
}

.panel {
    background: rgba(255,255,255,.9);
    padding: 12px 18px;
    border-radius: 20px;
    font-weight: bold;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
}

/* CONTROLS */

#controls {
    position: absolute;
    bottom: 25px;
    left: 25px;
    z-index: 30;
}

button {
    border: none;
    background: white;
    padding: 13px 18px;
    margin: 3px;
    border-radius: 12px;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,.2);
}

button:active {
    transform: scale(.9);
}

/* START SCREEN */

#startScreen {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.startBox {
    background: white;
    padding: 40px;
    border-radius: 30px;
    text-align: center;
    max-width: 500px;
    box-shadow: 0 15px 40px rgba(0,0,0,.2);
}

.startBox h1 {
    font-size: 45px;
    margin-bottom: 5px;
}

.startBox p {
    font-size: 18px;
    line-height: 1.5;
}

.startButton {
    background: #7c5cff;
    color: white;
    font-size: 22px;
    padding: 15px 30px;
}

/* END SCREEN */

#endScreen {
    position: absolute;
    inset: 0;
    background: rgba(30,20,50,.92);
    color: white;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    text-align: center;
}

.endBox {
    background: #ffffff;
    color: #333;
    padding: 40px;
    border-radius: 30px;
    width: min(90%,500px);
}

.endBox h1 {
    font-size: 40px;
}

.restart {
    background: #ff7b7b;
    color: white;
}

/* MESSAGE */

#message {
    position: absolute;
    top: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    padding: 12px 25px;
    border-radius: 20px;
    display: none;
    z-index: 50;
    font-weight: bold;
}

</style>
</head>

<body>

<div id="game">

    <div class="sun"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <div class="house house1">
        <div class="window"></div>
        <div class="door"></div>
    </div>

    <div class="house house2">
        <div class="window"></div>
        <div class="door"></div>
    </div>

    <div class="road"></div>

    <!-- ITEMS -->

    <div class="item" id="sunItem" onclick="collect('morning')">
        ☀️
    </div>

    <div class="item" id="foodItem" onclick="collect('food')">
        🥞
    </div>

    <div class="item" id="musicItem" onclick="collect('fun')">
        🎵
    </div>

    <!-- OBSTACLES -->

    <div class="bad" id="alarm" onclick="annoy('alarm')">
        ⏰
    </div>

    <div class="bad" id="homework" onclick="annoy('homework')">
        📚
    </div>

    <!-- PLAYER -->

    <div id="player">
        <div class="head"></div>
        <div class="body"></div>
    </div>

    <!-- UI -->

    <div id="topbar">

        <div class="panel">
            my PERFECT day :)
        </div>

        <div class="panel">
            ⭐ Perfect Points: <span id="score">0</span>
        </div>

    </div>

    <div id="message"></div>

    <!-- CONTROLS -->

    <div id="controls">

        <button onclick="move('left')">⬅️</button>
        <button onclick="move('up')">⬆️</button>
        <button onclick="move('down')">⬇️</button>
        <button onclick="move('right')">➡️</button>

    </div>

    <!-- START -->

    <div id="startScreen">

        <div class="startBox">

            <h1>🌈 My Perfect Day</h1>

            <p>
                Your alarm went off 😴<br>
                You are still inside the blankets 🛌<br><br>

                but still today is your day.
            </p>

            <p>
                Explore the town and collect the things
                that make your perfect day.
            </p>

            <button class="startButton" onclick="startGame()">
                Start my day ☀️
            </button>

        </div>

    </div>

    <!-- END -->

    <div id="endScreen">

        <div class="endBox">

            <h1 id="endingTitle">
                🎉 PERFECT DAY!
            </h1>

            <p id="endingText"></p>

            <h2>
                ⭐ Final Score:
                <span id="finalScore">0</span>
            </h2>

            <button class="restart" onclick="location.reload()">
                🔄 LIVE ANOTHER DAY
            </button>

        </div>

    </div>

</div>

<script>

let score = 0;

let collected = {
    morning: false,
    food: false,
    fun: false
};

let playerX = window.innerWidth / 2;
let playerY = window.innerHeight * .7;

const player = document.getElementById("player");

function startGame() {

    document.getElementById("startScreen").style.display = "none";

    showMessage("Your perfect day starts NOW! ✨");

}

function move(direction) {

    const speed = 35;

    if(direction === "left") {
        playerX -= speed;
    }

    if(direction === "right") {
        playerX += speed;
    }

    if(direction === "up") {
        playerY -= speed;
    }

    if(direction === "down") {
        playerY += speed;
    }

    playerX = Math.max(20, Math.min(window.innerWidth - 70, playerX));

    playerY = Math.max(120, Math.min(window.innerHeight - 120, playerY));

    player.style.left = playerX + "px";
    player.style.top = playerY + "px";

    checkNearby();

}

document.addEventListener("keydown", function(e) {

    if(e.key === "ArrowLeft") move("left");

    if(e.key === "ArrowRight") move("right");

    if(e.key === "ArrowUp") move("up");

    if(e.key === "ArrowDown") move("down");

});

function checkNearby() {

    const playerRect = player.getBoundingClientRect();

    document.querySelectorAll(".item").forEach(item => {

        const rect = item.getBoundingClientRect();

        if(
            Math.abs(playerRect.left - rect.left) < 55 &&
            Math.abs(playerRect.top - rect.top) < 55
        ) {

            if(item.id === "sunItem") {
                collect("morning");
            }

            if(item.id === "foodItem") {
                collect("food");
            }

            if(item.id === "musicItem") {
                collect("fun");
            }

        }

    });

}

function collect(type) {

    if(collected[type]) return;

    collected[type] = true;

    score += 100;

    document.getElementById("score").innerText = score;

    if(type === "morning") {

        document.getElementById("sunItem").style.display = "none";

        showMessage("☀️ You chose a peaceful morning!");

    }

    if(type === "food") {

        document.getElementById("foodItem").style.display = "none";

        showMessage("🍕 FOOD ACQUIRED. Priorities. 😂");

    }

    if(type === "fun") {

        document.getElementById("musicItem").style.display = "none";

        showMessage("🎵 LET'S GOOOO! Fun unlocked!");

    }

    checkWin();

}

function annoy(type) {

    if(type === "alarm") {

        score -= 20;

        showMessage("⏰ THE ALARM ATTACKED! -20 points 😭");

        document.getElementById("alarm").style.display = "none";

    }

    if(type === "homework") {

        score -= 20;

        showMessage("📚 You found homework. RUN. -20 points 💀");

        document.getElementById("homework").style.display = "none";

    }

    document.getElementById("score").innerText = score;

}

function checkWin() {

    if(
        collected.morning &&
        collected.food &&
        collected.fun
    ) {

        setTimeout(endGame, 700);

    }

}

function endGame() {

    document.getElementById("endScreen").style.display = "flex";

    document.getElementById("finalScore").innerText = score;

    let title;
    let text;

    if(score >= 300) {

        title = "🌟 ABSOLUTELY PERFECT!";

        text =
        "You created the ultimate perfect day. " +
        "Good vibes, good food and absolutely zero regrets. 😂";

    }

    else if(score >= 240) {

        title = "✨ PRETTY PERFECT!";

        text =
        "Not everything went according to plan..." +
        "but honestly, that's what made the day memorable.";

    }

    else {

        title = "😂 CHAOTIC PERFECT DAY!";

        text =
        "Was this actually a perfect day? " +
        "Probably not. Was it entertaining? DEFINITELY.";

    }

    document.getElementById("endingTitle").innerText = title;

    document.getElementById("endingText").innerText = text;

}

function showMessage(text) {

    const box = document.getElementById("message");

    box.innerText = text;

    box.style.display = "block";

    setTimeout(() => {

        box.style.display = "none";

    }, 1800);

}

</script>

</body>
</html>

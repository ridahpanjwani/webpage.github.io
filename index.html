<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Build Your Perfect Day ☀️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: #3d3a35;
      background: linear-gradient(135deg, #fff7df, #e8f1df);
      transition: background 0.8s ease;
    }

    .app {
      width: min(900px, 92%);
      margin: auto;
      min-height: 100vh;
      padding: 50px 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Header */

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .sun {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .header h1 {
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: normal;
      line-height: 0.95;
      margin-bottom: 18px;
    }

    .header p {
      color: #777064;
      font-size: 1.1rem;
    }

    /* Progress */

    .progress-container {
      margin-bottom: 30px;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-family: Arial, sans-serif;
      font-size: 0.75rem;
      color: #817a6d;
      margin-bottom: 8px;
    }

    .progress {
      height: 6px;
      background: rgba(70, 60, 40, 0.12);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #536b52;
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    /* Card */

    .card {
      background: rgba(255, 253, 247, 0.88);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 45px;
      box-shadow: 0 20px 70px rgba(80, 70, 45, 0.12);
    }

    .question {
      text-align: center;
      margin-bottom: 30px;
    }

    .question h2 {
      font-size: 2.3rem;
      font-weight: normal;
      margin-bottom: 8px;
    }

    .question p {
      color: #817a6d;
    }

    /* Options */

    .options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .option {
      border: 2px solid transparent;
      background: #f4eee1;
      border-radius: 20px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: left;
    }

    .option:hover {
      transform: translateY(-3px);
      background: #eee5d3;
    }

    .option.selected {
      border-color: #536b52;
      background: #e5eddc;
      transform: translateY(-3px);
    }

    .option .emoji {
      font-size: 2rem;
      display: block;
      margin-bottom: 10px;
    }

    .option strong {
      display: block;
      font-size: 1.2rem;
      font-weight: normal;
      margin-bottom: 4px;
    }

    .option span {
      color: #817a6d;
      font-size: 0.9rem;
    }

    /* Navigation */

    .navigation {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 13px 25px;
      font-family: Arial, sans-serif;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.25s ease;
    }

    .back {
      background: transparent;
      color: #777064;
    }

    .back:hover {
      background: #eee7d8;
    }

    .next {
      background: #536b52;
      color: white;
    }

    .next:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(50, 70, 50, 0.2);
    }

    .next:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Result */

    .result {
      display: none;
      text-align: center;
    }

    .result.visible {
      display: block;
    }

    .result .big-sun {
      font-size: 4rem;
      margin-bottom: 15px;
    }

    .result h2 {
      font-size: 3rem;
      font-weight: normal;
      margin-bottom: 10px;
    }

    .result-intro {
      color: #777064;
      margin-bottom: 35px;
    }

* {

#game {

/* TOP BAR */

.topbar {
    position: absolute;

    height: 70px;
    background: #fffaf0;
    display: flex;
    align-items: center;
    justify-content: space-between;

/* SUPERMARKET */

.market {

    left: 0;
    width: 100%;

    background-size: 40px 40px;
}

/* AISLES */

.aisle {
    position: absolute;
    width: 210px;
    height: 100px;

    border-radius: 12px;
    border: 5px solid #bcae91;
    box-shadow: 0 8px 15px #0002;
}

.aisle h3 {
    text-align: center;
    margin-top: 10px;
    font-size: 15px;
    color: #514b40;
}

.shelf {
    height: 12px;
    background: #8f836e;

    border-radius: 5px;
}

/* AISLE POSITIONS */

.bakery {
    left: 8%;

}

.drinks {
    right: 8%;
    top: 15%;
}

.snacks {
    left: 8%;
    top: 55%;
}

.fun {
    right: 8%;
    top: 55%;
}

/* CHECKOUT */

.checkout {
    position: absolute;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    width: 180px;
    height: 75px;

    border-radius: 15px;

/* CHARACTER */

}

/* HEAD */

.head {
    width: 28px;
    height: 28px;
    background: #f2c6a0;
    border-radius: 50%;
    position: absolute;
    left: 8px;
    top: 0;
    border: 2px solid #333;
}

/* HAIR */

.hair {
    width: 30px;
    height: 18px;
    background: #4a3024;
    border-radius: 20px 20px 5px 5px;
    position: absolute;
    left: 7px;
    top: -2px;
}

.body {

}

/* SHOPPING CART */

<script>

/* ================================
   PLAYER
================================ */

const player =
    document.getElementById("player");

const message =
    document.getElementById("message");


let x = window.innerWidth / 2;

let y = window.innerHeight * .4;

let speed = 5;


/* ================================
   KEYBOARD
================================ */

const keys = {};


document.addEventListener("keydown", function(event) {

    keys[event.key.toLowerCase()] = true;

});


document.addEventListener("keyup", function(event) {

    keys[event.key.toLowerCase()] = false;

});


/* ================================
   MOVEMENT
================================ */

function move() {

    let moving = false;


    if(keys["arrowup"] || keys["w"]) {

        y -= speed;

        moving = true;

    }


    if(keys["arrowdown"] || keys["s"]) {

        y += speed;

        moving = true;

    }


    if(keys["arrowleft"] || keys["a"]) {

        x -= speed;

        moving = true;

    }


    if(keys["arrowright"] || keys["d"]) {

        x += speed;

        moving = true;

    }


    /* KEEP PLAYER ON SCREEN */

    x = Math.max(5, Math.min(
        window.innerWidth - 55,
        x
    ));

    y = Math.max(80, Math.min(
        window.innerHeight - 65,
        y
    ));


    player.style.left = x + "px";

    player.style.top = y + "px";


    checkAreas();


    requestAnimationFrame(move);

}


/* ================================
   AREA DETECTION
================================ */

function checkAreas() {

    const px = x;
    const py = y;


    /* BAKERY */

    if(
        px > window.innerWidth * .05 &&
        px < window.innerWidth * .35 &&
        py > window.innerHeight * .20 &&
        py < window.innerHeight * .40
    ) {

        message.innerHTML =
            "🥐 You're near the bakery!<br>" +
            "Something smells suspiciously good.";

        return;

    }


    /* DRINKS */

    if(
        px > window.innerWidth * .60 &&
        py > window.innerHeight * .20 &&
        py < window.innerHeight * .40
    ) {

        message.innerHTML =
            "🥤 The drinks aisle.<br>" +
            "Hydration or questionable amounts of caffeine?";

        return;

    }


    /* SNACKS */

    if(
        px > window.innerWidth * .05 &&
        px < window.innerWidth * .35 &&
        py > window.innerHeight * .55 &&
        py < window.innerHeight * .75
    ) {

        message.innerHTML =
            "🍕 Snacks detected.<br>" +
            "Your self-control has left the building.";

        return;

    }


    /* FUN */

    if(
        px > window.innerWidth * .60 &&
        py > window.innerHeight * .55 &&
        py < window.innerHeight * .75
    ) {

        message.innerHTML =
            "🎮 FUN AISLE<br>" +
            "You definitely don't need this...";

        return;

    }


    message.innerHTML =
        "🛒 Explore the supermarket!<br>" +
        "Find something for your perfect day.";

}

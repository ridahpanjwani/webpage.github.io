
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DON'T GET CAUGHT</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #090b10;
    color: white;
    overflow: hidden;
}

#game {
    height: 100vh;
}

#topbar {
    height: 70px;
    background: #090b10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 25px;
    border-bottom: 2px solid #333;
}

#title {
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 3px;
}

#timer {
    font-size: 26px;
    color: #ff5555;
    font-weight: bold;
}

#room {
    position: relative;
    height: calc(100vh - 130px);
    background:
        linear-gradient(rgba(20,25,35,.2), rgba(5,7,10,.75)),
        repeating-linear-gradient(
            90deg,
            #303744 0px,
            #303744 80px,
            #29303b 80px,
            #29303b 160px
        );
}

#floor {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 28%;
    background:
        repeating-linear-gradient(
            90deg,
            #4b362b 0px,
            #4b362b 70px,
            #3d2c24 70px,
            #3d2c24 140px
        );
    border-top: 5px solid #241a16;
}

/* OBJECTS */

.object {
    position: absolute;
    cursor: pointer;
    transition: .2s;
    user-select: none;
}

.object:hover {
    transform: scale(1.08);
    filter: brightness(1.4);
}

#desk {
    width: 190px;
    height: 90px;
    background: #754c2d;
    left: 18%;
    bottom: 24%;
    border-radius: 8px;
    box-shadow: 0 15px 0 #4a301f;
}

#desk::before {
    content: "🗄️";
    font-size: 55px;
    position: absolute;
    left: 65px;
    top: 15px;
}

#books {
    font-size: 75px;
    left: 45%;
    bottom: 30%;
}

#bag {
    font-size: 75px;
    left: 70%;
    bottom: 25%;
}

#computer {
    font-size: 75px;
    left: 75%;
    top: 22%;
}

#door {
    width: 130px;
    height: 250px;
    background: #553622;
    right: 5%;
    top: 15%;
    border: 8px solid #291b13;
    border-radius: 4px;
}

#door::after {
    content: "🚪";
    font-size: 75px;
    position: absolute;
    top: 80px;
    left: 25px;
}

/* MESSAGE */

#message {
    position: absolute;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    background: rgba(0,0,0,.85);
    padding: 15px 25px;
    border-radius: 10px;
    font-size: 17px;
    text-align: center;
    max-width: 550px;
}

/* INVENTORY */

#inventory {
    height: 60px;
    background: #090b10;
    display: flex;
    align-items: center;
    padding-left: 20px;
    gap: 12px;
}

.item {
    background: #242934;
    border: 1px solid #555;
    padding: 8px 14px;
    border-radius: 8px;
}

/* PUZZLE */

#puzzle {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.8);
    justify-content: center;
    align-items: center;
    z-index: 10;
}

#puzzleBox {
    background: #171b24;
    padding: 35px;
    border-radius: 18px;
    width: 350px;
    text-align: center;
    border: 2px solid #444;
    box-shadow: 0 0 40px rgba(0,0,0,.7);
}

#puzzleBox h2 {
    margin-top: 0;
}

#password {
    width: 100%;
    padding: 13px;
    margin: 15px 0;
    background: #0c0f15;
    border: 1px solid #555;
    border-radius: 8px;
    color: white;
    font-size: 20px;
    text-align: center;
}

button {
    padding: 11px 25px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
}

#submit {
    background: #4caf50;
    color: white;
}

#close {
    background: #444;
    color: white;
    margin-left: 8px;
}
</style>
</head>

<body>

<div id="game">

    <div id="topbar">
        <div id="title">DON'T GET CAUGHT</div>
        <div id="timer">05:00</div>
    </div>

    <div id="room">

        <div id="floor"></div>

        <div class="object" id="desk" onclick="inspect('desk')"></div>

        <div class="object" id="books" onclick="inspect('books')">
            📚
        </div>

        <div class="object" id="bag" onclick="inspect('bag')">
            🎒
        </div>

        <div class="object" id="computer" onclick="inspect('computer')">
            💻
        </div>

        <div class="object" id="door" onclick="inspect('door')"></div>

        <div id="message">
            The classroom is empty...
            <br>
            <b>Find a way out.</b>
        </div>

    </div>

    <div id="inventory">
        <b>INVENTORY:</b>
    </div>

</div>


<!-- PUZZLE WINDOW -->

<div id="puzzle">

    <div id="puzzleBox">

        <h2>💻 COMPUTER LOCKED</h2>

        <p>Enter the password you discovered.</p>

        <input
            id="password"
            type="text"
            placeholder="Password"
        >

        <br>

        <button id="submit" onclick="checkPassword()">
            UNLOCK
        </button>

        <button id="close" onclick="closePuzzle()">
            CLOSE
        </button>

        <p id="wrong"></p>

    </div>

</div>


<script>

let time = 300;

let foundClue = false;
let computerUnlocked = false;
let hasKey = false;
let escaped = false;


/* TIMER */

const timer = setInterval(() => {

    if (escaped) return;

    time--;

    let minutes = Math.floor(time / 60);
    let seconds = time % 60;

    document.getElementById("timer").textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");

    if (time <= 30) {
        document.getElementById("timer").style.color = "red";
    }

    if (time <= 0) {

        clearInterval(timer);

        document.getElementById("message").innerHTML =
            "🚨 TIME'S UP!<br><br>" +
            "<b>You got caught.</b>";
    }

}, 1000);


/* OBJECT INTERACTIONS */

function inspect(object) {

    const message = document.getElementById("message");


    /* BOOKS */

    if (object === "books") {

        foundClue = true;

        message.innerHTML =
            "You flip through the books...<br><br>" +
            "📖 A note falls out:<br>" +
            "<b>THE PASSWORD IS 472</b>";

        return;
    }


    /* COMPUTER */

    if (object === "computer") {

        if (!foundClue) {

            message.innerHTML =
                "💻 The computer is locked.<br>" +
                "Maybe there's a clue somewhere.";

        } else if (!computerUnlocked) {

            document.getElementById("puzzle").style.display = "flex";

        } else {

            message.innerHTML =
                "The computer is already unlocked.";
        }

        return;
    }


    /* DESK */

    if (object === "desk") {

        if (!computerUnlocked) {

            message.innerHTML =
                "🗄️ Nothing useful here...<br>" +
                "Maybe unlock the computer first.";

        } else if (!hasKey) {

            hasKey = true;

            message.innerHTML =
                "🗝️ You open the secret drawer...<br>" +
                "<b>You found the escape key!</b>";

            addItem("🗝️ Escape Key");

        }

        return;
    }


    /* BAG */

    if (object === "bag") {

        message.innerHTML =
            "🎒 Just someone's school bag.<br>" +
            "Definitely not yours.";

        return;
    }


    /* DOOR */

    if (object === "door") {

        if (!hasKey) {

            message.innerHTML =
                "🔒 LOCKED.<br>" +
                "You need the escape key.";

        } else {

            escaped = true;

            clearInterval(timer);

            message.innerHTML =
                "🔓 CLICK!<br><br>" +
                "🎉 <b>YOU ESCAPED!</b><br><br>" +
                "You made it out before the teacher returned.";

        }

    }

}


/* PASSWORD */

function checkPassword() {

    const password =
        document.getElementById("password").value;

    const wrong =
        document.getElementById("wrong");


    if (password === "472") {

        computerUnlocked = true;

        document.getElementById("puzzle").style.display = "none";

        document.getElementById("message").innerHTML =
            "💻 ACCESS GRANTED!<br><br>" +
            "The computer unlocked a secret drawer.";

        addItem("💻 Computer Unlocked");

    } else {

        wrong.textContent =
            "❌ Wrong password. Look for another clue.";

    }

}


/* CLOSE PUZZLE */

function closePuzzle() {

    document.getElementById("puzzle").style.display = "none";

}


/* INVENTORY */

function addItem(item) {

    const inventory =
        document.getElementById("inventory");

    const newItem =
        document.createElement("div");

    newItem.className = "item";

    newItem.textContent = item;

    inventory.appendChild(newItem);

}

</script>

</body>
</html>
